# Listeners du staging Open eIDAS sur le Gateway partagé "shared-gateway"
# (namespace ingress), possédé par une autre Application ArgoCD.
#
# ServerSideApply=true est INDISPENSABLE ici : c'est ce qui permet à cette
# Application de n'ajouter que ses propres entrées de spec.listeners (liste
# associative par "name") sans écraser celles gérées par l'autre Application
# — voir manifests/staging-gateway/listeners.yaml pour le détail.
#
# prune désactivé délibérément : si cette Application ou son manifeste
# disparaissait, un prune automatique supprimerait l'objet Gateway entier
# (partagé avec d'autres domaines), pas seulement nos trois listeners.
# Retirer les listeners obsolètes se fait à la main
# (`kubectl edit gateway -n ingress shared-gateway` ou équivalent), jamais
# par ArgoCD sur cette ressource partagée.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: open-eidas-staging-gateway
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  project: default

  source:
    repoURL: https://github.com/open-eidas/deploy.git
    targetRevision: main
    path: manifests/staging-gateway

  destination:
    server: https://kubernetes.default.svc
    namespace: ingress

  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
