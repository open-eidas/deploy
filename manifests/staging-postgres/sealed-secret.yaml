# Scellé avec kubeseal contre le certificat public du contrôleur
# sealed-secrets du cluster de staging (namespace sealed-secrets). Une fois
# déchiffré par ce contrôleur, produit le Secret Opaque "open-eidas-generated"
# consommé à la fois par le chart open-eidas (secrets.existingSecret, voir
# values-staging.yaml) et par le bootstrap du Cluster CloudNativePG
# (cluster.yaml) : postgres-password/password portent la même valeur.
#
# Ne PEUT être re-déchiffré que par la clé privée de CE cluster : committer
# ce fichier ne divulgue rien tant que cette clé n'est pas elle-même
# compromise.
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: open-eidas-generated
  namespace: open-eidas-staging
spec:
  encryptedData:
    ca-issuing-pin: 
    ca-root-pin: 
    enroll-hmac-key: 
    ocsp-pin: 
    password: 
    postgres-password: 
    tsa-pin: 
    username: 
    webdav-password: 
  template:
    metadata:
      name: open-eidas-generated
      namespace: open-eidas-staging
